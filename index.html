async function uploadVideo(file) {
  const name = file.name || "video.mp4";
  const ext = name.includes(".") ? name.split(".").pop() : "mp4";
  const path = `videos/${Date.now()}_${Math.random().toString(36).slice(2)}.${ext}`;
  const contentType = file.type || "video/mp4";

  // Get current session token
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) throw new Error("ログインが必要です");

  const { data, error } = await supabase.storage
    .from(BUCKET)
    .upload(path, file, {
      contentType,
      upsert: false,
      cacheControl: "3600",
    });

  if (error) {
    console.error("Upload error detail:", JSON.stringify(error));
    throw new Error(error.message || "アップロードに失敗しました");
  }

  const { data: urlData } = supabase.storage.from(BUCKET).getPublicUrl(path);
  return urlData.publicUrl;
}

// ── DB helpers ──
async function fetchPosts(tab, exercise=null) {
  let query = supabase.from("posts").select("*, profiles(name, avatar)").eq("tab", tab).not("video_url", "is", null).order("created_at", { ascending: false });
  if(exercise) query = query.eq("exercise", exercise);
  const { data, error } = await query;
  if (error) return [];

  // likesは別途まとめて取得
  const ids = data.map(p => p.id);
  let likesMap = {};
  if (ids.length > 0) {
    const { data: likesData } = await supabase
      .from("likes")
      .select("post_id")
      .in("post_id", ids);
    (likesData || []).forEach(l => {
      likesMap[l.post_id] = (likesMap[l.post_id] || 0) + 1;
    });
  }

  return data.map(p => ({
    id: p.id,
    tab: p.tab,
    user: p.profiles?.name || "ゲスト",
    avatar: p.profiles?.avatar || "🐨",
    exercise: p.exercise,
    weight: p.weight,
    reps: p.reps,
    sets: p.sets,
    bodyWeight: p.body_weight,
    comment: p.comment,
    videoUrl: p.video_url,
    overlayIcons: p.overlay_icons || [],
    tips: p.tips || [],
    likes: likesMap[p.id] || 0,
    time: timeAgo(p.created_at),
    comments: [],
    user_id: p.user_id,
    isBodyweight: p.is_bodyweight || false,
  }));
}

async function savePost(data, userId) {
  const payload = {
    user_id: userId,
    tab: data.tab,
    exercise: data.exercise,
    weight: data.weight,
    reps: data.reps,
    sets: data.sets,
    body_weight: data.bodyWeight,
    comment: data.comment,
    video_url: data.videoUrl,
    overlay_icons: data.overlayIcons || [],
    tips: data.tips || [],
    is_bodyweight: data.isBodyweight || false,
  };
  let { error } = await supabase.from("posts").insert(payload);
  // tipsカラムがない場合はtipsを除いて再試行
  if (error?.code === "PGRST204" || error?.message?.includes("tips")) {
    const { tips: _, ...payloadWithoutTips } = payload;
    ({ error } = await supabase.from("posts").insert(payloadWithoutTips));
  }
  if (error) {
    console.error("savePost error:", JSON.stringify(error));
    throw new Error(`DB保存エラー: ${error.message} (code: ${error.code})`);
  }
}

// ── Likes ──
async function fetchMyLike(postId, userId) {
  const { data } = await supabase.from("likes").select("id").eq("post_id", postId).eq("user_id", userId).maybeSingle();
  return !!data;
}
async function toggleLike(postId, userId, currentlyLiked) {
  if (currentlyLiked) {
    await supabase.from("likes").delete().eq("post_id", postId).eq("user_id", userId);
  } else {
    await supabase.from("likes").insert({ post_id: postId, user_id: userId });
  }
}

// ── Comments DB ──
async function fetchCommentsDB(postId) {
  const { data, error } = await supabase
    .from("comments")
    .select("*, profiles(name, avatar)")
    .eq("post_id", postId)
    .is("parent_id", null)
    .order("created_at", { ascending: true });
  if (error || !data) return [];
  const { data: replies } = await supabase
    .from("comments")
    .select("*, profiles(name, avatar)")
    .eq("post_id", postId)
    .not("parent_id", "is", null)
    .order("created_at", { ascending: true });
  return data.map(c => ({
    id: c.id,
    user: c.profiles?.name || "ゲスト",
    avatar: c.profiles?.avatar || "🐨",
    text: c.text,
    time: timeAgo(c.created_at),
    replies: (replies || []).filter(r => r.parent_id === c.id).map(r => ({
      id: r.id,
      user: r.profiles?.name || "ゲスト",
      avatar: r.profiles?.avatar || "🐨",
      text: r.text,
      time: timeAgo(r.created_at),
    })),
  }));
}
async function saveCommentDB(postId, userId, text, parentId = null) {
  const { data, error } = await supabase.from("comments")
    .insert({ post_id: postId, user_id: userId, text, parent_id: parentId })
    .select("*, profiles(name, avatar)").single();
  if (error) throw error;
  return {
    id: data.id,
    user: data.profiles?.name || "ゲスト",
    avatar: data.profiles?.avatar || "🐨",
    text: data.text,
    time: "今",
    replies: [],
  };
}

async function fetchFollowCounts(userId) {
  const [{ count: following }, { count: followers }] = await Promise.all([
    supabase.from("follows").select("*", { count: "exact", head: true }).eq("follower_id", userId),
    supabase.from("follows").select("*", { count: "exact", head: true }).eq("following_id", userId),
  ]);
  return { following: following || 0, followers: followers || 0 };
}

async function upsertProfile(userId, profile) {
  await supabase.from("profiles").upsert({
    id: userId,
    name: profile.name,
    avatar: profile.avatar,
    weight: profile.weight,

  });
}

async function fetchProfile(userId) {

}

function timeAgo(ts) {
  if (!ts) return "";
  const diff = Math.floor((Date.now() - new Date(ts)) / 1000);
  if (diff < 60) return "今";
  if (diff < 3600) return `${Math.floor(diff/60)}分前`;
  if (diff < 86400) return `${Math.floor(diff/3600)}時間前`;
  return `${Math.floor(diff/86400)}日前`;
}

const calc1RM = (w,r) => { if(!w||!r) return null; if(r===1) return w; return Math.round(w*(1+r/30)); };

// 部位ごとに体重比の基準を調整
const TAB_THRESHOLDS = {
  "胸":  [0.5, 0.8, 1.1, 1.4],  // ベンチ系：比較的重い
  "背中": [0.6, 1.0, 1.4, 1.8], // デッド系：最も重い
  "肩":  [0.2, 0.35, 0.5, 0.7], // サイドレイズ系：軽い
  "腕":  [0.3, 0.5, 0.7, 0.9],  // カール系：中程度
  "脚":  [0.7, 1.1, 1.5, 2.0],  // スクワット系：最重量
};
const LEVEL_META = [
  { label:"初心者", bg:"#f0f4ff", border:"#c7d7fd", text:"#3b5bdb", val:"#2c4bb5" },
  { label:"初級",   bg:"#f0fdf4", border:"#bbf7d0", text:"#16a34a", val:"#14532d" },
  { label:"中級",   bg:"#fefce8", border:"#fde68a", text:"#ca8a04", val:"#92400e" },
  { label:"上級",   bg:"#fff7ed", border:"#fed7aa", text:"#ea580c", val:"#7c2d12" },
  { label:"エリート",bg:"#fdf2f8", border:"#f0abfc", text:"#a21caf", val:"#701a75" },
];
const getRatio = (w, bw, tab="胸") => {
  if(!w||!bw) return null;
  const r = parseFloat((w/bw).toFixed(2));
  const thr = TAB_THRESHOLDS[tab] || TAB_THRESHOLDS["胸"];
  const idx = thr.findIndex(t => r < t);
  const lvl = LEVEL_META[idx === -1 ? 4 : idx];
  return { ratio: r.toFixed(2), level: lvl.label, ...lvl };
};

/* ── Video Trimmer ── */
function VideoTrimmer({previewUrl, onDone, onBack}){
  const videoRef = useRef(null);
  const [duration, setDuration] = useState(0);
  const [startT, setStartT] = useState(0);
  const [endT, setEndT] = useState(0);
  const [trimming, setTrimming] = useState(false);
  const [progress, setProgress] = useState(0);

  const fmt = s => `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,"0")}`;

  useEffect(()=>{
    const v = videoRef.current;
    if(!v) return;
    const onMeta = ()=>{ setDuration(v.duration); setEndT(v.duration); };
    v.addEventListener("loadedmetadata", onMeta);
    return()=>v.removeEventListener("loadedmetadata", onMeta);
  },[]);

  // startTが変わったらプレビュー位置を移動
  useEffect(()=>{
    if(videoRef.current) videoRef.current.currentTime = startT;
  },[startT]);

  // endTを超えたらstartTに戻す
  useEffect(()=>{
    const v = videoRef.current;
    if(!v) return;
    const check = ()=>{ if(v.currentTime >= endT) v.currentTime = startT; };
    v.addEventListener("timeupdate", check);
    return()=>v.removeEventListener("timeupdate", check);
  },[startT, endT]);

  const handleTrim = async()=>{
    setTrimming(true); setProgress(0);
    try{
      const v = videoRef.current;
      v.pause();
      v.currentTime = startT;
      await new Promise(r=>{ v.onseeked = r; });
      const stream = v.captureStream ? v.captureStream() : v.mozCaptureStream();
      const mimeType = MediaRecorder.isTypeSupported("video/mp4") ? "video/mp4" : "video/webm";
      const rec = new MediaRecorder(stream, {mimeType, videoBitsPerSecond:5000000});
      const chunks = [];
      rec.ondataavailable = e=>{ if(e.data.size>0) chunks.push(e.data); };
      rec.start(100);
      v.play();
      const trimLen = endT - startT;
      const startMs = Date.now();
      await new Promise(resolve=>{
        const tick = setInterval(()=>{
          const elapsed = (Date.now()-startMs)/1000;
          setProgress(Math.min(elapsed/trimLen, 0.95));
          if(elapsed >= trimLen){ clearInterval(tick); resolve(); }
        }, 100);
      });
      rec.stop(); v.pause();
      await new Promise(r=>{ rec.onstop = r; });
      setProgress(1);
      const blob = new Blob(chunks, {type: mimeType});
      const ext = mimeType.includes("mp4") ? "mp4" : "webm";
      const file = new File([blob], `trimmed.${ext}`, {type: mimeType});
      onDone(file, URL.createObjectURL(blob));
    }catch(e){
      alert("トリミングに失敗しました。別の方法をお試しください。");
      setTrimming(false);
    }
  };

  const trimLen = endT - startT;

  return(
    <div style={{position:"absolute",inset:0,background:"#000",zIndex:400,display:"flex",flexDirection:"column"}}>
      {/* header */}
      <div style={{position:"absolute",top:0,left:0,right:0,zIndex:10,padding:"calc(14px + var(--sat)) 16px 14px",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <button onClick={onBack} style={{background:"rgba(0,0,0,0.5)",backdropFilter:"blur(8px)",border:"none",borderRadius:20,padding:"7px 14px",cursor:"pointer",display:"flex",alignItems:"center",gap:5,color:"#fff",fontSize:13,fontWeight:700}}>
          {Ic.back(16)}<span>戻る</span>
        </button>
        <div style={{background:"rgba(0,0,0,0.5)",backdropFilter:"blur(8px)",borderRadius:20,padding:"6px 16px"}}>
          <span style={{color:"#fff",fontWeight:900,fontSize:14}}>✂️ トリミング</span>
        </div>
        <button onClick={handleTrim} disabled={trimming||trimLen<=0.5} style={{background:trimming?"rgba(255,255,255,0.2)":"rgba(255,255,255,0.95)",color:trimming?"rgba(255,255,255,0.5)":"#111",border:"none",borderRadius:20,padding:"7px 18px",fontWeight:800,fontSize:13,cursor:trimming?"default":"pointer"}}>
          {trimming?`${Math.round(progress*100)}%`:"完了"}
        </button>
      </div>

      {/* video */}
      <div style={{flex:1,position:"relative",overflow:"hidden"}}>
        <video ref={videoRef} src={previewUrl} style={{width:"100%",height:"100%",objectFit:"contain"}} playsInline autoPlay loop/>
        {trimming&&(
          <div style={{position:"absolute",inset:0,background:"rgba(0,0,0,0.7)",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:20}}>
            <div style={{color:"#fff",fontWeight:900,fontSize:18}}>処理中...</div>
            <div style={{width:"65%",height:4,background:"rgba(255,255,255,0.2)",borderRadius:2}}>
              <div style={{width:`${progress*100}%`,height:"100%",background:"#fff",borderRadius:2,transition:"width 0.1s"}}/>
            </div>
            <div style={{color:"rgba(255,255,255,0.6)",fontSize:14,fontWeight:600}}>{Math.round(progress*100)}%</div>
          </div>
        )}
        {/* 選択範囲オーバーレイ */}
        {!trimming&&duration>0&&(
          <>
            <div style={{position:"absolute",top:0,bottom:0,left:0,width:`${(startT/duration)*100}%`,background:"rgba(0,0,0,0.55)"}}/>
            <div style={{position:"absolute",top:0,bottom:0,right:0,width:`${((duration-endT)/duration)*100}%`,background:"rgba(0,0,0,0.55)"}}/>
          </>
        )}
      </div>

      {/* controls */}
      <div style={{background:"rgba(10,10,10,0.95)",padding:"24px 24px calc(32px + var(--sab))"}}>
        {/* 時間表示 */}
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
          <div style={{textAlign:"center"}}>
            <div style={{color:"rgba(255,255,255,0.5)",fontSize:10,fontWeight:700,marginBottom:2}}>開始</div>
            <div style={{color:"#fff",fontSize:18,fontWeight:900,fontVariantNumeric:"tabular-nums"}}>{fmt(startT)}</div>
          </div>
          <div style={{textAlign:"center"}}>
            <div style={{color:"rgba(255,255,255,0.5)",fontSize:10,fontWeight:700,marginBottom:2}}>選択尺</div>
            <div style={{color:"#fff",fontSize:22,fontWeight:900,fontVariantNumeric:"tabular-nums"}}>{fmt(trimLen)}</div>
          </div>
          <div style={{textAlign:"center"}}>
            <div style={{color:"rgba(255,255,255,0.5)",fontSize:10,fontWeight:700,marginBottom:2}}>終了</div>
            <div style={{color:"#fff",fontSize:18,fontWeight:900,fontVariantNumeric:"tabular-nums"}}>{fmt(endT)}</div>
          </div>
        </div>

        {/* タイムライン */}
        <div style={{position:"relative",height:40,background:"rgba(255,255,255,0.1)",borderRadius:8,marginBottom:20,overflow:"visible"}}>
          {duration>0&&(
            <div style={{
              position:"absolute",top:0,bottom:0,
              left:`${(startT/duration)*100}%`,
              width:`${((endT-startT)/duration)*100}%`,
              background:"rgba(255,255,255,0.25)",
              borderLeft:"3px solid #fff",
              borderRight:"3px solid #fff",
              borderRadius:3,
            }}/>
          )}
        </div>

        <div style={{display:"flex",flexDirection:"column",gap:16}}>
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <span style={{color:"rgba(255,255,255,0.5)",fontSize:11,fontWeight:700,width:36}}>開始</span>
            <input type="range" min={0} max={Math.max(0,duration-0.5)} step={0.1} value={startT}
              onChange={e=>setStartT(Math.min(+e.target.value,endT-0.5))}
              style={{flex:1,accentColor:"#fff",height:4}}/>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <span style={{color:"rgba(255,255,255,0.5)",fontSize:11,fontWeight:700,width:36}}>終了</span>
            <input type="range" min={Math.min(startT+0.5,duration)} max={duration} step={0.1} value={endT}
              onChange={e=>setEndT(+e.target.value)}
              style={{flex:1,accentColor:"#fff",height:4}}/>
          </div>
        </div>

        {trimLen>60&&(
          <div style={{marginTop:12,background:"rgba(251,191,36,0.15)",borderRadius:10,padding:"8px 12px",border:"1px solid rgba(251,191,36,0.3)"}}>
            <span style={{color:"#fbbf24",fontSize:12,fontWeight:700}}>⚠️ 10秒前後が見やすくてオススメ</span>
          </div>
        )}
      </div>
    </div>
  );
}

/* ── Icon Placer (replaces Mosaic) ── */
function IconPlacer({previewUrl, onDone, onBack}){
  const [icons, setIcons] = useState([]);
  const [selIcon, setSelIcon] = useState(OVERLAY_ICONS[0]);
  const [selSize, setSelSize] = useState(96);
  const [selectedId, setSelectedId] = useState(null);
  const areaRef = useRef(null);
  const videoRef = useRef(null);
  const isDragging = useRef(false); // ドラッグ中は新規配置をブロック

  const getAreaRect = () => areaRef.current?.getBoundingClientRect();

  const placeIcon = (clientX, clientY) => {
    const r = getAreaRect();
    if(!r) return;
    const cx = Math.max(0, Math.min(100, (clientX - r.left) / r.width * 100));
    const cy = Math.max(0, Math.min(100, (clientY - r.top) / r.height * 100));
    setIcons(prev => [...prev, {id:Date.now(), icon:selIcon, x:cx, y:cy, size:selSize}]);
  };

  const handleAreaClick = (e) => {
    if(isDragging.current) return;
    placeIcon(e.clientX, e.clientY);
  };

  const handleTouchEnd = (e) => {
    e.preventDefault();
    e.stopPropagation();
    if(isDragging.current) return;
    const t = e.changedTouches[0];
    placeIcon(t.clientX, t.clientY);
  };

  const moveIcon = (id, nx, ny) => {
    isDragging.current = true;
    setIcons(prev => prev.map(i => i.id===id ? {...i, x:nx, y:ny} : i));
  };

  const endDrag = () => {
    setTimeout(()=>{ isDragging.current = false; }, 50);
  };

  const removeIcon = (e, id) => {
    e.preventDefault();
    e.stopPropagation();
    setIcons(prev => prev.filter(i => i.id !== id));
  };

  return(
    <div style={{position:"absolute",inset:0,background:"#000",zIndex:400,display:"flex",flexDirection:"column",animation:"fadeIn 0.2s ease"}}>
      <div style={{padding:"14px 16px",display:"flex",alignItems:"center",justifyContent:"space-between",borderBottom:"1px solid #222"}}>
        <button onClick={onBack} style={{background:"none",border:"none",cursor:"pointer",padding:4}}>{Ic.back(22)}</button>
        <div style={{color:"#fff",fontWeight:800,fontSize:15}}>顔隠しアイコン</div>
        <button onClick={()=>onDone(icons)} style={{background:"#fff",color:"#111",border:"none",borderRadius:20,padding:"7px 18px",fontWeight:800,fontSize:13,cursor:"pointer"}}>完了</button>
      </div>

      <div style={{color:"#aaa",fontSize:12,fontWeight:600,textAlign:"center",padding:"6px 0"}}>
        動画をタップ → アイコン設置　　アイコンをドラッグ → 移動　　タップ → 削除
      </div>

      {/* icon selector */}
      <div style={{display:"flex",gap:8,padding:"8px 12px",overflowX:"auto",background:"#111",borderBottom:"1px solid #222",flexShrink:0,WebkitOverflowScrolling:"touch"}}>
        {OVERLAY_ICONS.map(ic=>(

}

function IconOverlay({icons, onRemove, onMove, onDragEnd, areaRef}){
  const [ready, setReady] = useState(false);
  const dragging = useRef(null);

  useEffect(()=>{
    const t = setTimeout(()=>setReady(true), 100);
    return ()=>clearTimeout(t);
  },[]);

  if(!ready||!icons.length) return null;

  const getAreaRect = () => areaRef.current?.getBoundingClientRect();

  const onPointerDown = (e, ic) => {
    e.stopPropagation();
    e.preventDefault();
    dragging.current = {
      id: ic.id,
      startX: e.clientX,
      startY: e.clientY,
      origX: ic.x,
      origY: ic.y,
      moved: false,
    };
    const handleMove = (ev) => {
      if(!dragging.current) return;
      const dx = ev.clientX - dragging.current.startX;
      const dy = ev.clientY - dragging.current.startY;
      if(Math.abs(dx)>4||Math.abs(dy)>4) dragging.current.moved = true;
      const r = getAreaRect();
      if(!r) return;
      const nx = Math.max(0, Math.min(100, dragging.current.origX + dx/r.width*100));
      const ny = Math.max(0, Math.min(100, dragging.current.origY + dy/r.height*100));
      onMove(dragging.current.id, nx, ny);
    };
    const handleUp = (ev) => {
      if(dragging.current && !dragging.current.moved){
        onRemove(ev, dragging.current.id);
      }
      dragging.current = null;
      onDragEnd && onDragEnd();
      window.removeEventListener("pointermove", handleMove);
      window.removeEventListener("pointerup", handleUp);
    };
    window.addEventListener("pointermove", handleMove);
    window.addEventListener("pointerup", handleUp);
  };

  return(
    <>
      {icons.map(ic=>(
        <div
          key={ic.id}
          style={{
            position:"absolute",
            left:`${ic.x}%`,
            top:`${ic.y}%`,
            fontSize:ic.size,
            transform:"translate(-50%,-50%)",
            filter:"drop-shadow(0 2px 6px rgba(0,0,0,0.5))",
            zIndex:10,
            userSelect:"none",
            cursor:"grab",
            touchAction:"none",
          }}
          onPointerDown={e=>onPointerDown(e,ic)}
        >
          {ic.icon}
        </div>
      ))}
    </>
  );
}

/* ── Comments Sheet ── */
function CommentsSheet({post,onClose,onAdd,profile,authUser}){
  const [text,setText]=useState("");
  const [comments,setComments]=useState([]);
  const [loading,setLoading]=useState(true);
  const [sending,setSending]=useState(false);

  useEffect(()=>{
    setLoading(true);
    fetchCommentsDB(post.id).then(cs=>{setComments(cs);setLoading(false);});
  },[post.id]);

  const addReply=async(parentId, replyText)=>{
    if(!authUser) return;
    try{
      const r = await saveCommentDB(post.id, authUser.id, replyText, parentId);
      setComments(prev=>prev.map(c=>c.id===parentId?{...c,replies:[...(c.replies||[]),r]}:c));
    }catch(e){ console.error(e); }
  };

  const handleSend=async()=>{
    if(!text.trim()||!authUser||sending) return;
    setSending(true);
    try{
      const c = await saveCommentDB(post.id, authUser.id, text.trim());
      setComments(prev=>[...prev, c]);
      onAdd(text.trim());
      setText("");
    }catch(e){ console.error(e); }
    setSending(false);
  };

  return(
    <div style={{position:"absolute",inset:0,background:"rgba(0,0,0,0.3)",zIndex:200,animation:"fadeIn 0.2s ease"}} onClick={onClose}>
      <div style={{position:"absolute",bottom:0,left:0,right:0,background:"#fff",borderRadius:"22px 22px 0 0",maxHeight:"78vh",display:"flex",flexDirection:"column",animation:"sheetUp 0.3s ease"}} onClick={e=>e.stopPropagation()}>
        <div style={{display:"flex",justifyContent:"center",padding:"10px 0 0"}}><div style={{width:36,height:4,borderRadius:2,background:"#e0e0e0"}}/></div>
        <div style={{padding:"10px 16px 12px",display:"flex",alignItems:"center",justifyContent:"space-between",borderBottom:"1.5px solid #f2f2f2"}}>
          <div style={{fontWeight:800,fontSize:15}}>コメント {comments.reduce((s,c)=>s+1+(c.replies?.length||0),0)}件</div>
          <button onClick={onClose} style={{width:30,height:30,borderRadius:"50%",background:"#f2f2f2",border:"none",fontSize:16,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",color:"#666"}}>✕</button>
        </div>
        <div style={{flex:1,overflowY:"auto",padding:"14px 16px"}}>
          {loading?(
            <div style={{textAlign:"center",color:"#ccc",padding:"40px 0",fontSize:13,fontWeight:700}}>読み込み中...</div>
          ):comments.length===0?(
            <div style={{textAlign:"center",color:"#ccc",padding:"40px 0",fontSize:13,fontWeight:700}}><div style={{fontSize:40,marginBottom:10}}>💬</div>まだコメントがありません</div>
          ):(
            comments.map((c,i)=><CommentItem key={c.id||i} c={c} depth={0} profile={profile} onAddReply={t=>addReply(c.id,t)}/>)
          )}
        </div>
        <div style={{padding:"10px 16px 34px",borderTop:"1.5px solid #f2f2f2",display:"flex",gap:10}}>
          <input value={text} onChange={e=>setText(e.target.value)} onKeyDown={e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();handleSend();}}} placeholder="アドバイスを入力..." style={{flex:1,background:"#f7f7f7",border:"none",borderRadius:24,padding:"11px 16px",color:"#111",fontSize:14,outline:"none",fontFamily:"inherit",fontWeight:600}}/>
          <button onClick={handleSend} disabled={sending||!text.trim()} style={{background:sending||!text.trim()?"#ddd":"#111",color:sending||!text.trim()?"#aaa":"#fff",border:"none",borderRadius:24,padding:"11px 20px",fontWeight:800,cursor:sending?"default":"pointer",fontSize:14}}>
            {sending?"...":"送信"}
          </button>
        </div>
      </div>
    </div>
  );
}

/* ── Video Slide ── */
function VideoSlide({post,isFirst,onCommentOpen,authUser,onDelete,onGuide}){
  const [liked,setLiked]=useState(false);
  const [likeCount,setLikeCount]=useState(post.likes||0);
  const [pop,setPop]=useState(false);
  const [copied,setCopied]=useState(false);
  const [muted,setMuted]=useState(true);
  const [following,setFollowing]=useState(false);
  const [followLoading,setFollowLoading]=useState(false);
  const isOwn = authUser?.id === post.user_id;
  const ratio=getRatio(post.weight,post.bodyWeight,post.tab);
  const rm=calc1RM(post.weight,post.reps);

  const [commentCount,setCommentCount]=useState(post.comments?.length||0);

  useEffect(()=>{
    if(!authUser) return;
    fetchMyLike(post.id, authUser.id).then(setLiked);
    if(!isOwn) fetchIsFollowing(authUser.id, post.user_id).then(setFollowing);
    // DBからコメント数を取得
    supabase.from("comments").select("*",{count:"exact",head:true}).eq("post_id",post.id).then(({count})=>{ if(count!=null) setCommentCount(count); });
  },[post.id, authUser?.id]);

  const handleLike=async()=>{
    if(!authUser) return;
    const next=!liked;
    setLiked(next);
    setLikeCount(c=>next?c+1:c-1);
    setPop(true);setTimeout(()=>setPop(false),300);
    await toggleLike(post.id, authUser.id, liked);
    const {count} = await supabase.from("likes").select("*",{count:"exact",head:true}).eq("post_id",post.id);
    if(count!=null) setLikeCount(count);
  };
  const handleFollow=async()=>{
    if(!authUser||isOwn||followLoading) return;
    setFollowLoading(true);
    const next=!following;
    setFollowing(next);
    await toggleFollow(authUser.id, post.user_id, !next);
    setFollowLoading(false);
  };
  const handleShare=()=>{
    const url=`https://formie-alpha.vercel.app`;
    if(navigator.clipboard){
      navigator.clipboard.writeText(url).then(()=>{setCopied(true);setTimeout(()=>setCopied(false),2000);});
    }
  };

  // ダブルタップいいね
  const lastTap=useRef(0);
  const [heartPos,setHeartPos]=useState(null);
  const handleDoubleTap=(e)=>{
    const now=Date.now();
    if(now-lastTap.current<300){
      // ダブルタップ
      const rect=e.currentTarget.getBoundingClientRect();
      const x=e.clientX-rect.left;
      const y=e.clientY-rect.top;
      setHeartPos({x,y});
      setTimeout(()=>setHeartPos(null),800);
      if(!liked){
        setLiked(true);
        setLikeCount(c=>c+1);
        setPop(true);setTimeout(()=>setPop(false),300);
        toggleLike(post.id, authUser?.id, liked);
      }
    }
    lastTap.current=now;
  };

  return(
    <div style={{width:"100%",height:"100%",position:"relative",background:"#111",flexShrink:0,overflow:"hidden"}} onClick={handleDoubleTap}>
      {/* video */}
      {post.videoUrl
        ? <video src={post.videoUrl}
            style={{position:"absolute",inset:0,width:"100%",height:"100%",objectFit:"cover",opacity:0,transition:"opacity 0.2s"}}
            loop muted={muted} playsInline autoPlay preload="auto"
            onCanPlay={e=>e.target.style.opacity=1}
            onError={e=>{const s=e.target.closest('[data-slide]');if(s)s.style.display='none';}}
          />
        : <div style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center"}}><div style={{opacity:0.1,fontSize:88,color:"#fff"}}>🎬</div></div>
      }

      {/* ダブルタップハートアニメーション */}
      {heartPos&&(
        <div style={{position:"absolute",left:heartPos.x,top:heartPos.y,transform:"translate(-50%,-50%)",fontSize:72,zIndex:50,pointerEvents:"none",animation:"zoomIn 0.15s ease,fadeOut 0.6s ease 0.2s forwards"}}>❤️</div>
      )}

      {/* gradient */}
      <div style={{position:"absolute",bottom:0,left:0,right:0,height:"52%",background:"linear-gradient(to top,rgba(0,0,0,0.82) 0%,rgba(0,0,0,0.35) 55%,transparent 100%)",pointerEvents:"none"}}/>

      {/* overlay icons */}
      {(post.overlayIcons||[]).map((ic,i)=>(
        <div key={i} style={{position:"absolute",left:`${ic.x}%`,top:`${ic.y}%`,fontSize:ic.size||48,transform:"translate(-50%,-50%)",pointerEvents:"none",filter:"drop-shadow(0 2px 6px rgba(0,0,0,0.5))"}}>{ic.icon}</div>
      ))}

      {/* top */}
      <div style={{position:"absolute",top:14,left:16,right:14,display:"flex",alignItems:"center",justifyContent:"space-between",zIndex:2,pointerEvents:"none"}}>
        <div style={{background:"rgba(0,0,0,0.5)",backdropFilter:"blur(4px)",color:"#fff",borderRadius:20,padding:"5px 14px",fontSize:12,fontWeight:800,pointerEvents:"auto"}}>{post.tab}</div>
        <button onClick={e=>{e.stopPropagation();onGuide&&onGuide();}} style={{background:"rgba(0,0,0,0.55)",backdropFilter:"blur(6px)",border:"none",borderRadius:24,padding:"8px 14px",cursor:"pointer",display:"flex",alignItems:"center",gap:6,pointerEvents:"auto",boxShadow:"0 2px 8px rgba(0,0,0,0.3)"}}>
          <span style={{fontSize:18}}>📖</span>
          <span style={{color:"#fff",fontSize:11,fontWeight:800,letterSpacing:0.3}}>Training Tips</span>
        </button>
      </div>

      {/* RIGHT: actions — aligned to bottom */}
      <div onClick={e=>e.stopPropagation()} style={{position:"absolute",bottom:90,right:12,display:"flex",flexDirection:"column",alignItems:"center",gap:22,zIndex:3}}>
        {/* アバター */}
        <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:4}}>
          <div style={{width:46,height:46,borderRadius:"50%",background:"rgba(255,255,255,0.15)",backdropFilter:"blur(4px)",border:"2.5px solid rgba(255,255,255,0.7)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:26}}>
            {post.avatar}
          </div>
          {!isOwn&&(
            <button onClick={handleFollow} disabled={followLoading} style={{background:following?"rgba(255,255,255,0.25)":"#fff",color:following?"#fff":"#111",border:following?"1.5px solid rgba(255,255,255,0.6)":"none",borderRadius:20,padding:"3px 10px",fontSize:10,fontWeight:800,cursor:"pointer",backdropFilter:"blur(4px)",transition:"all 0.2s",minWidth:52}}>
              {following?"✓ 済":"＋ フォロー"}
            </button>
          )}
        </div>
        <button onClick={handleLike} style={{background:"none",border:"none",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:2,padding:0}}>
          <div style={{transition:"transform 0.15s",transform:pop?"scale(1.4)":"scale(1)"}}>{Ic.heart(liked,34)}</div>
          <span style={{color:"#fff",fontSize:12,fontWeight:800,textShadow:"0 1px 4px rgba(0,0,0,0.8)"}}>{likeCount}</span>
        </button>
        <button onClick={e=>{e.stopPropagation();onCommentOpen(()=>setCommentCount(c=>c+1));}} style={{background:"none",border:"none",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:2,padding:0}}>
          <svg width={34} height={34} viewBox="0 0 24 24" fill="white" strokeWidth="0">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          </svg>
          <span style={{color:"#fff",fontSize:12,fontWeight:800,textShadow:"0 1px 4px rgba(0,0,0,0.8)"}}>{commentCount}</span>
        </button>
        <button onClick={handleShare} style={{background:"none",border:"none",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:2,padding:0}}>
          <svg width={32} height={32} viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
            <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
            <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
          </svg>
          <span style={{color:"#fff",fontSize:12,fontWeight:800,textShadow:"0 1px 4px rgba(0,0,0,0.8)"}}>Share</span>
        </button>
        <button onClick={e=>{e.stopPropagation();setMuted(m=>!m);}} style={{background:"none",border:"none",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:2,padding:0}}>
          <div style={{width:34,height:34,borderRadius:"50%",background:"rgba(255,255,255,0.15)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:18}}>{muted?"🔇":"🔊"}</div>
          <span style={{color:"#fff",fontSize:11,fontWeight:800,textShadow:"0 1px 4px rgba(0,0,0,0.8)"}}>Mute</span>
        </button>
      </div>

      {/* BOTTOM LEFT */}
      <div style={{position:"absolute",bottom:18,left:14,right:68,zIndex:3}}>

        {/* row1: username */}
        <div style={{marginBottom:4}}>
          <span style={{color:"#fff",fontWeight:900,fontSize:16,textShadow:"0 1px 5px rgba(0,0,0,0.8)"}}>{post.user}</span>
        </div>

        {/* row2: comment */}
        {post.comment&&(
          <div style={{marginBottom:7}}>
            <span style={{color:"rgba(255,255,255,0.88)",fontSize:14,fontWeight:600,textShadow:"0 1px 3px rgba(0,0,0,0.7)"}}>{post.comment}</span>
          </div>
        )}

        {/* row3: 種目・重量・レップ */}
        <div style={{display:"flex",gap:5,flexWrap:"wrap",alignItems:"center",marginBottom:5}}>
          {[
            ["種目",  post.exercise],
            ["重量",  post.isBodyweight?"自重":`${post.weight}kg`],
            ["レップ",`${post.reps}回×${post.sets}`],
          ].map(([l,v])=>(
            <div key={l} style={{background:"rgba(255,255,255,0.2)",backdropFilter:"blur(8px)",borderRadius:8,padding:"0 10px",border:"1px solid rgba(255,255,255,0.3)",display:"flex",gap:5,alignItems:"center",height:26}}>
              <span style={{fontSize:10,color:"rgba(255,255,255,0.65)",fontWeight:700,whiteSpace:"nowrap"}}>{l}</span>
              <span style={{fontSize:12,color:"#fff",fontWeight:800,fontFamily:"'DM Mono',monospace",whiteSpace:"nowrap"}}>{v}</span>
            </div>
          ))}
        </div>

        {/* row4: エリート・1RM */}
        {(ratio||rm)&&(
          <div style={{display:"flex",gap:5,flexWrap:"wrap",alignItems:"center",marginBottom:(post.tips||[]).length>0?5:0}}>
            {ratio&&(
              <div style={{background:ratio.bg,borderRadius:8,padding:"0 10px",border:`1.5px solid ${ratio.border}`,display:"flex",gap:5,alignItems:"center",height:26}}>
                <span style={{fontSize:10,color:ratio.text,fontWeight:700,whiteSpace:"nowrap"}}>{ratio.level}</span>
                <span style={{fontSize:12,color:ratio.val,fontWeight:800,fontFamily:"'DM Mono',monospace",whiteSpace:"nowrap"}}>{ratio.ratio}x</span>
              </div>
            )}
            {rm&&(
              <div style={{background:"#eff6ff",borderRadius:8,padding:"0 10px",border:"1.5px solid #bfdbfe",display:"flex",gap:5,alignItems:"center",height:26}}>
                <span style={{fontSize:10,color:"#2563eb",fontWeight:700,whiteSpace:"nowrap"}}>1RM</span>
                <span style={{fontSize:12,color:"#1e3a8a",fontWeight:800,fontFamily:"'DM Mono',monospace",whiteSpace:"nowrap"}}>{rm}kg</span>
              </div>
            )}
          </div>
        )}
        {/* row5: コツ */}
        {(post.tips||[]).length>0&&(
          <div style={{display:"flex",flexDirection:"column",gap:3,marginTop:2}}>
            {post.tips.map((t,i)=>(
              <div key={i} style={{display:"flex",alignItems:"center",gap:5}}>
                <span style={{fontSize:11}}>💡</span>
                <span style={{color:"rgba(255,255,255,0.85)",fontSize:12,fontWeight:600,textShadow:"0 1px 3px rgba(0,0,0,0.7)"}}>{t}</span>
              </div>
            ))}
          </div>
        )}
      </div>

      {copied&&(
        <div style={{position:"absolute",top:"40%",left:"50%",transform:"translate(-50%,-50%)",background:"rgba(0,0,0,0.8)",borderRadius:14,padding:"12px 20px",color:"#fff",fontSize:14,fontWeight:800,pointerEvents:"none",whiteSpace:"nowrap",animation:"fadeIn 0.2s ease",zIndex:10}}>
          🔗 URLをコピーしました
        </div>
      )}
    </div>
  );
}

          {[["投稿",myPosts.length],["フォロー",followCounts.following],["フォロワー",followCounts.followers],["いいね",myPosts.reduce((s,p)=>s+(p.likes||0),0)]].map(([l,v])=>(

        </div>
      </div>
      {myPosts.length>0?(
        <div>

      ):(

          <div style={{fontSize:44,marginBottom:10}}>📹</div>
          <div style={{fontSize:13,fontWeight:700,color:"#bbb"}}>まだ投稿がありません</div>
        </div>
      )}
      <div style={{padding:"16px 16px 40px"}}>
      </div>
    </div>
  );
}

/* ── Tips Selector ── */
function TipsSelector({exercise, selectedTips, onChangeTips}){
  const storageKey = `formie_tips_custom_${exercise}`;

  // 保存済みカスタムコツ or デフォルトコツを初期値に
  const getInitialTips = ()=>{
    try{
      const saved = localStorage.getItem(storageKey);
      if(saved) return JSON.parse(saved);
    }catch(e){}
    // EXERCISE_TIPSから取得、なければGUIDE_DATAから取得
    if(EXERCISE_TIPS[exercise]) return EXERCISE_TIPS[exercise].slice(0,3);
    // GUIDE_DATAの全部位から種目名で検索してtipを取得
    for(const tab of Object.keys(GUIDE_DATA)){
      const found = GUIDE_DATA[tab].find(g=>g.name===exercise);
      if(found && found.tip) return [found.tip];
    }
    return [""]; // カスタム種目はブランク1つ
  };

  const [tips, setTips] = useState(getInitialTips);
  const [editIdx, setEditIdx] = useState(null); // 編集中のindex
  const [editVal, setEditVal] = useState("");
  const [otherTips, setOtherTips] = useState([]); // 他の人のコツ

  // 他の人のコツをDBから取得
  useEffect(()=>{
    supabase.from("posts").select("tips").eq("exercise", exercise).not("tips","eq","[]").limit(30)
      .then(({data})=>{
        if(!data) return;
        const all = data.flatMap(p=>p.tips||[]).filter(Boolean);
        const unique = [...new Set(all)];
        // 自分のコツと被らないものだけ
        setOtherTips(unique.filter(t=>!tips.includes(t)).slice(0,5));
      });
  },[exercise]);

  const saveTips = (next)=>{
    setTips(next);
    try{ localStorage.setItem(storageKey, JSON.stringify(next)); }catch(e){}
    // 選択中のやつも更新
    onChangeTips(prev=>prev.map(t=>{
      // 編集前のテキストが選択中なら新テキストに置換
      return t; // 編集完了後に反映するので後で処理
    }));
  };

  const finishEdit = (idx)=>{
    const trimmed = editVal.trim();
    if(!trimmed){ setEditIdx(null); return; }
    const next = [...tips];
    const old = next[idx];
    next[idx] = trimmed;
    saveTips(next);
    // 選択中だったら新テキストに置換
    onChangeTips(prev=>prev.includes(old)?[...prev.filter(t=>t!==old), trimmed]:prev);
    setEditIdx(null);
  };

  const toggleTip = (tip)=>{
    onChangeTips(prev=>prev.includes(tip)?prev.filter(t=>t!==tip):[...prev,tip]);
  };

  const addOtherTip = (tip)=>{
    // 3番目以降に追加（カスタム種目追加的な感じ）
    if(tips.includes(tip)) return;
    // selectedTipsに追加
    onChangeTips(prev=>prev.includes(tip)?prev:[...prev,tip]);
    setOtherTips(prev=>prev.filter(t=>t!==tip));
  };

  return(
    <div style={{marginTop:14}}>
      <label style={{color:"#aaa",fontSize:11,fontWeight:700,display:"block",marginBottom:8,letterSpacing:0.5}}>
        💡 今回意識したコツ（タップで選択、長押しで編集）
      </label>
      <div style={{display:"flex",flexDirection:"column",gap:6}}>
        {tips.map((tip,idx)=>{
          const on = selectedTips.includes(tip);
          if(editIdx===idx) return(
            <div key={idx} style={{display:"flex",gap:6,alignItems:"center"}}>
              <input
                autoFocus
                value={editVal}
                onChange={e=>setEditVal(e.target.value)}
                onBlur={()=>finishEdit(idx)}
                onKeyDown={e=>{if(e.key==="Enter")finishEdit(idx);if(e.key==="Escape")setEditIdx(null);}}
                style={{flex:1,padding:"10px 14px",borderRadius:12,border:"2px solid #333",fontSize:13,fontWeight:600,outline:"none",fontFamily:"inherit"}}
              />
              <button onClick={()=>finishEdit(idx)} style={{background:"#f0f0f0",color:"#111",border:"1.5px solid #ddd",borderRadius:10,padding:"10px 14px",fontWeight:800,cursor:"pointer",fontSize:13}}>保存</button>
            </div>
          );
          return(
            <button key={idx}
              onClick={()=>toggleTip(tip)}
              onContextMenu={e=>{e.preventDefault();setEditIdx(idx);setEditVal(tip);}}
              onPointerDown={e=>{
                if(e.pointerType==="touch"){
                  const t=setTimeout(()=>{setEditIdx(idx);setEditVal(tip);},500);
                  e.currentTarget._longpress=t;
                }
              }}
              onPointerUp={e=>{ clearTimeout(e.currentTarget._longpress); }}
              onPointerCancel={e=>{ clearTimeout(e.currentTarget._longpress); }}
              style={{textAlign:"left",padding:"10px 14px",borderRadius:12,border:`1.5px solid ${on?"#333":"#e5e5e5"}`,background:on?"#f0f0f0":"#f7f7f7",color:"#111",fontSize:13,fontWeight:on?800:600,cursor:"pointer",display:"flex",alignItems:"center",gap:8,transition:"all 0.15s"}}>
              <span style={{fontSize:15,color:on?"#111":"#bbb"}}>{on?"✓":"○"}</span>
              <span style={{flex:1}}>{tip||<span style={{color:"#ccc"}}>タップして新しいコツを入力...</span>}</span>
              <span style={{fontSize:11,opacity:0.3}}>長押し編集</span>
            </button>
          );
        })}
      </div>

      {/* 他の人のコツ */}
      {otherTips.length>0&&(
        <div style={{marginTop:12}}>
          <div style={{color:"#aaa",fontSize:11,fontWeight:700,marginBottom:6,letterSpacing:0.5}}>こんなコツも 💡</div>
          <div style={{display:"flex",flexDirection:"column",gap:5}}>
            {otherTips.map((tip,i)=>(
              <button key={i} onClick={()=>addOtherTip(tip)}
                style={{textAlign:"left",padding:"9px 14px",borderRadius:12,border:"1.5px dashed #e5e5e5",background:"#fafafa",color:"#888",fontSize:12,fontWeight:600,cursor:"pointer",display:"flex",alignItems:"center",gap:8,transition:"all 0.15s"}}>
                <span style={{fontSize:14}}>＋</span>
                <span>{tip}</span>
              </button>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

function PostModal({onClose,onPost,profile,exercises,onAddExercise,authUserRef}){
  const [step,setStep]=useState(0);
  const [videoFile,setVideoFile]=useState(null);
  const [previewUrl,setPreviewUrl]=useState(null);
  const [overlayIcons,setOverlayIcons]=useState([]);
  const [showIconPlacer,setShowIconPlacer]=useState(false);
  const [showTrimmer,setShowTrimmer]=useState(false);
  const [videoDuration,setVideoDuration]=useState(0);
  const [selTab,setSelTab]=useState(TABS[0]);
  const [exercise,setExercise]=useState("");
  const [customMode,setCustomMode]=useState(false);
  const [customInput,setCustomInput]=useState("");
  const [isBodyweight,setIsBodyweight]=useState(false);
  const [weight,setWeight]=useState(DEFAULT_WEIGHT[TABS[0]]||60);
  const [reps,setReps]=useState(10);
  const [sets,setSets]=useState(3);
  const [comment,setComment]=useState("");
  const [selectedTips,setSelectedTips]=useState([]);
  const [uploading,setUploading]=useState(false);
  const [uploadErr,setUploadErr]=useState("");
  const [done,setDone]=useState(false);
  const fileInputRef=useRef(null);

  const bw=profile.weight||70;
  const rm=isBodyweight?null:calc1RM(weight,reps);
  const ratio=isBodyweight?null:getRatio(weight,bw,selTab);
  const exList=exercises[selTab]||[];
  const chosenEx=exercise||(customMode?customInput:"");
  const canNext=step===1?!!chosenEx:step===0?!!videoFile:true;
  const inp={width:"100%",background:"#f7f7f7",border:"1.5px solid #ebebeb",borderRadius:14,padding:"12px 14px",color:"#111",fontSize:15,outline:"none",fontFamily:"inherit",fontWeight:600};

  const handleFileChange=(e)=>{
    const f=e.target.files[0];
    if(!f) return;
    // 200MB limit check
    if(f.size > 200*1024*1024){
      setUploadErr("動画が大きすぎます（200MB以上）。短く撮り直すか、圧縮してください。");
      return;
    }
    setVideoFile(f);
    setPreviewUrl(URL.createObjectURL(f));
    setUploadErr("");
  };

  if(showIconPlacer) return <IconPlacer previewUrl={previewUrl} onDone={icons=>{setOverlayIcons(icons);setShowIconPlacer(false);}} onBack={()=>setShowIconPlacer(false)}/>;
  if(showTrimmer) return <VideoTrimmer previewUrl={previewUrl} onDone={(file,url)=>{setVideoFile(file);setPreviewUrl(url);setShowTrimmer(false);}} onBack={()=>setShowTrimmer(false)}/>;

  const handleNext=async()=>{
    if(step===0){ setStep(1); return; }
    if(step===1){
      if(customMode&&customInput.trim()) onAddExercise(selTab,customInput.trim());
      setStep(2); return;
    }
    if(step===2){ setStep(3); return; }
    // step 3: upload then post
    setUploading(true);
    setUploadErr("");
    try{
      const videoUrl=await uploadVideo(videoFile);
      await savePost({exercise:chosenEx||"未入力",weight:isBodyweight?0:weight,reps,sets,bodyWeight:bw,comment,tips:selectedTips,avatar:profile.avatar||"🐨",tab:selTab,overlayIcons,videoUrl,isBodyweight},authUserRef.current?.id);
      onPost({exercise:chosenEx||"未入力",weight:isBodyweight?0:weight,reps,sets,bodyWeight:bw,comment,tips:selectedTips,avatar:profile.avatar||"🐨",tab:selTab,overlayIcons,videoUrl,isBodyweight});
      setUploading(false);
      setDone(true);
      setTimeout(()=>onClose(), 2200);
    }catch(e){
      console.error("post error:",e);
      setUploadErr(`❌ ${e.message||"投稿に失敗しました"}`);
      setUploading(false);
    }
  };

  return(
    <div style={{position:"absolute",inset:0,background:"#fff",zIndex:300,display:"flex",flexDirection:"column",animation:"fadeIn 0.18s ease"}}>

      {/* ── 投稿完了画面 ── */}
      {done&&(
        <div style={{position:"absolute",inset:0,background:"#fff",zIndex:10,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:16,animation:"zoomIn 0.3s ease"}}>
          <div style={{width:80,height:80,borderRadius:"50%",background:"#111",display:"flex",alignItems:"center",justifyContent:"center",fontSize:40}}>💪</div>
          <div style={{fontWeight:900,fontSize:22,color:"#111"}}>投稿完了！</div>
          <div style={{color:"#aaa",fontSize:14,fontWeight:600}}>フィードに反映されました</div>
          <div style={{display:"flex",gap:8,marginTop:8}}>
            {["胸","背中","肩","腕","脚","腹"].map(t=>(
              <div key={t} style={{width:8,height:8,borderRadius:"50%",background:t===selTab?"#111":"#e0e0e0"}}/>
            ))}
          </div>
          <div style={{marginTop:4,color:"#bbb",fontSize:12,fontWeight:600}}>自動で閉じます...</div>
        </div>
      )}

      <div style={{padding:"16px 16px 0",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <button onClick={onClose} style={{width:36,height:36,borderRadius:"50%",background:"#f2f2f2",border:"none",fontSize:18,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",color:"#555"}}>✕</button>
        <div style={{fontWeight:800,fontSize:15}}>{step===0?"動画を選ぶ":step===1?"種目を選ぶ":step===2?"トレーニング情報":"確認 & 投稿"}</div>
        <div style={{width:36}}/>
      </div>
      <div style={{display:"flex",gap:5,padding:"14px 16px 4px"}}>
        {[0,1,2,3].map(s=><div key={s} style={{flex:1,height:3,borderRadius:2,background:s<=step?"#111":"#ebebeb",transition:"background 0.3s"}}/>)}
      </div>

      <div style={{flex:1,overflowY:"auto",padding:"14px 16px 16px"}}>

        {/* STEP 0: video pick */}
        {step===0&&(
          <div style={{animation:"slideUp 0.25s ease"}}>
            <input ref={fileInputRef} type="file" accept="video/*,video/mp4,video/quicktime" onChange={handleFileChange} style={{display:"none"}}/>
            {!videoFile?(
              <div style={{marginBottom:16}}>
                <div onClick={()=>fileInputRef.current.click()} style={{width:"100%",height:260,background:"#f7f7f7",borderRadius:20,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",border:"1.5px dashed #ddd",cursor:"pointer",marginBottom:10}}>
                  <div style={{fontSize:48,marginBottom:10}}>📹</div>
                  <div style={{color:"#333",fontSize:15,fontWeight:800}}>タップして動画を選択</div>
                  <div style={{color:"#bbb",fontSize:12,marginTop:4,fontWeight:600}}>カメラロールから選べます</div>
                </div>
                <div style={{background:"#f7f7f7",borderRadius:12,padding:"10px 14px",display:"flex",alignItems:"center",gap:8}}>
                  <span style={{fontSize:16}}>💡</span>
                  <span style={{color:"#888",fontSize:12,fontWeight:700}}>10秒程度の動画推奨。短い方がフォームの確認がしやすいです。</span>
                </div>
              </div>
            ):(
              <div style={{marginBottom:16}}>
                <div style={{position:"relative",width:"100%",height:320,borderRadius:16,overflow:"hidden",background:"#111",marginBottom:8}}>
                  <video
                    src={previewUrl}
                    style={{width:"100%",height:"100%",objectFit:"cover",display:"block"}}
                    controls playsInline
                    onLoadedMetadata={e=>{ e.target.currentTime=0.1; e.target.play().catch(()=>{}); }}
                  />
                  {overlayIcons.map((ic,i)=>(
                    <div key={i} style={{position:"absolute",left:`${ic.x}%`,top:`${ic.y}%`,fontSize:ic.size,transform:"translate(-50%,-50%)",pointerEvents:"none",filter:"drop-shadow(0 2px 4px rgba(0,0,0,0.5))"}}>{ic.icon}</div>
                  ))}
                </div>

                  <button onClick={()=>setShowTrimmer(true)} style={{flex:1,height:40,borderRadius:12,border:"1.5px solid #ebebeb",background:"#f7f7f7",color:"#555",fontSize:13,fontWeight:700,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:5}}>

        {/* STEP 1: exercise */}
        {step===1&&(
          <div style={{animation:"slideUp 0.25s ease"}}>

                exercise={chosenEx}

              />
            )}

            <label style={{color:"#aaa",fontSize:11,fontWeight:700,display:"block",marginBottom:6,marginTop:14}}>一言コメント（任意）</label>
            <textarea value={comment} onChange={e=>setComment(e.target.value)} placeholder="気になる点や質問を書いてください..." rows={3} style={{...inp,lineHeight:1.8}}/>
          </div>
        )}

        {/* STEP 3: confirm */}
        {step===3&&(
          <div style={{animation:"slideUp 0.25s ease"}}>
            <div style={{background:"#f7f7f7",borderRadius:20,padding:20,marginBottom:16}}>
              <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:16}}>
                <div style={{width:46,height:46,borderRadius:"50%",background:"#ebebeb",display:"flex",alignItems:"center",justifyContent:"center",fontSize:24}}>{profile.avatar||"🐨"}</div>
                <div><div style={{fontWeight:800,fontSize:15}}>{profile.name||"あなた"}</div><div style={{color:"#aaa",fontSize:12,fontWeight:600}}>{selTab} · {chosenEx||"未選択"}</div></div>
              </div>
              <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                {[["重量",`${weight}kg`],["レップ",`${reps}回`],["セット",`${sets}セット`]].map(([l,v])=>(
                  <div key={l} style={{background:"#fff",borderRadius:10,padding:"6px 12px",border:"1.5px solid #ebebeb"}}><div style={{fontSize:9,color:"#aaa",fontWeight:700}}>{l}</div><div style={{fontSize:13,color:"#111",fontWeight:800,fontFamily:"'DM Mono',monospace"}}>{v}</div></div>
                ))}
                {ratio&&<div style={{background:ratio.bg,borderRadius:10,padding:"6px 12px",border:`1.5px solid ${ratio.border}`}}><div style={{fontSize:9,color:ratio.text,fontWeight:700}}>体重比</div><div style={{fontSize:13,color:ratio.val,fontWeight:800,fontFamily:"'DM Mono',monospace"}}>{ratio.ratio}x</div></div>}
                {rm&&<div style={{background:"#eff6ff",borderRadius:10,padding:"6px 12px",border:"1.5px solid #bfdbfe"}}><div style={{fontSize:9,color:"#2563eb",fontWeight:700}}>1RM</div><div style={{fontSize:13,color:"#1e3a8a",fontWeight:800,fontFamily:"'DM Mono',monospace"}}>{rm}kg</div></div>}
              </div>
              {comment&&<div style={{marginTop:12,color:"#555",fontSize:13,lineHeight:1.7,fontWeight:600}}>{comment}</div>}
              {selectedTips.length>0&&(
                <div style={{marginTop:12,display:"flex",flexDirection:"column",gap:4}}>
                  {selectedTips.map(t=>(
                    <div key={t} style={{display:"flex",alignItems:"flex-start",gap:6}}>
                      <span style={{color:"#f59e0b",fontSize:13}}>💡</span>
                      <span style={{fontSize:12,color:"#555",fontWeight:600,lineHeight:1.5}}>{t}</span>
                    </div>
                  ))}
                </div>
              )}
            </div>
            {previewUrl&&(
              <div style={{position:"relative",borderRadius:16,overflow:"hidden",marginBottom:8,background:"#111"}}>
                <video src={previewUrl} style={{width:"100%",borderRadius:16,maxHeight:200,objectFit:"cover",display:"block"}} muted playsInline/>
                {overlayIcons.map((ic,i)=>(
                  <div key={i} style={{position:"absolute",left:`${ic.x}%`,top:`${ic.y}%`,fontSize:ic.size,transform:"translate(-50%,-50%)",pointerEvents:"none",filter:"drop-shadow(0 2px 4px rgba(0,0,0,0.5))"}}>{ic.icon}</div>
                ))}
              </div>
            )}
            <div style={{background:"#f7f7f7",borderRadius:16,padding:14,display:"flex",alignItems:"center",gap:12}}>
              <div style={{fontSize:24}}>🎬</div>
              <div>
                <div style={{color:"#555",fontSize:13,fontWeight:700}}>動画準備完了</div>
                {overlayIcons.length>0&&<div style={{color:"#aaa",fontSize:12,fontWeight:600,marginTop:2}}>顔隠しアイコン {overlayIcons.length}個配置済み</div>}
              </div>
            </div>
            {uploadErr&&<div style={{marginTop:10,color:"#e11d48",fontSize:13,fontWeight:700,textAlign:"center"}}>{uploadErr}</div>}
          </div>
        )}
      </div>

      <div style={{padding:"12px 16px 36px",background:"#fff",borderTop:"1.5px solid #f2f2f2",display:"flex",gap:10}}>
        {step>0&&!uploading&&<button onClick={()=>setStep(s=>s-1)} style={{flex:1,height:52,borderRadius:16,border:"1.5px solid #ebebeb",background:"#f7f7f7",color:"#555",fontSize:15,cursor:"pointer",fontWeight:700}}>もどる</button>}
        <button onClick={handleNext} disabled={!canNext||uploading} style={{flex:2,height:52,borderRadius:16,border:"none",background:canNext&&!uploading?"#111":"#ddd",color:canNext&&!uploading?"#fff":"#aaa",fontSize:16,fontWeight:800,cursor:canNext&&!uploading?"pointer":"default",transition:"all 0.2s"}}>
          {uploading?"アップロード中...":(step<3?"つぎへ →":"投稿する 🚀")}
        </button>
      </div>
    </div>
  );
}

function LoginScreen({onAuth}){
  const [mode,setMode]=useState("login");
  const [email,setEmail]=useState("");
  const [password,setPassword]=useState("");
  const [loading,setLoading]=useState(false);
  const [err,setErr]=useState("");
  const [msg,setMsg]=useState("");
  const inp={width:"100%",background:"#f7f7f7",border:"1.5px solid #ebebeb",borderRadius:14,padding:"13px 16px",color:"#111",fontSize:15,outline:"none",fontFamily:"inherit",fontWeight:600,marginBottom:10};
  const handle=async()=>{
    if(!email||!password){setErr("メールとパスワードを入力してください");return;}
    setLoading(true);setErr("");setMsg("");
    try{
      if(mode==="signup"){
        const {error}=await supabase.auth.signUp({email,password});
        if(error)throw error;
        setMsg("確認メールを送りました。メールを確認してください。");
      }else{
        const {data,error}=await supabase.auth.signInWithPassword({email,password});
        if(error)throw error;
        onAuth(data.user);
      }
    }catch(e){setErr(e.message==="Invalid login credentials"?"メールまたはパスワードが違います":e.message);}
    setLoading(false);
  };
  const [showEmail,setShowEmail]=useState(false);  const handleGoogle=async()=>{
    setErr("");
    const {error}=await supabase.auth.signInWithOAuth({
      provider:"google",
      options:{redirectTo:window.location.origin}
    });
    if(error)setErr(error.message);
  };
  return(
    <div style={{width:"100%",height:"100dvh",background:"#fff",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",maxWidth:480,margin:"0 auto",padding:"0 32px",boxSizing:"border-box"}}>
      <div style={{marginBottom:44,textAlign:"center"}}>
        <div style={{fontSize:52,marginBottom:8}}>💪</div>
        <div style={{fontSize:30,fontWeight:900,letterSpacing:-1}}>Formie</div>
        <div style={{color:"#aaa",fontSize:14,fontWeight:600,marginTop:6}}>フォームを共有して、一緒に上手くなろう</div>
      </div>
      <div style={{width:"100%"}}>
        <button onClick={handleGoogle} style={{width:"100%",height:56,borderRadius:16,border:"1.5px solid #ebebeb",background:"#fff",color:"#111",fontSize:15,fontWeight:700,cursor:"pointer",marginBottom:12,display:"flex",alignItems:"center",justifyContent:"center",gap:10,boxShadow:"0 2px 8px rgba(0,0,0,0.08)"}}>
          <svg width="20" height="20" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
          Googleでログイン
        </button>
        <button onClick={async()=>{
          const {error}=await supabase.auth.signInWithOAuth({provider:"apple",options:{redirectTo:window.location.origin}});
          if(error)setErr(error.message);
        }} style={{width:"100%",height:56,borderRadius:16,border:"none",background:"#000",color:"#fff",fontSize:15,fontWeight:700,cursor:"pointer",marginBottom:24,display:"flex",alignItems:"center",justifyContent:"center",gap:10}}>
          <svg width="18" height="22" viewBox="0 0 814 1000" fill="white"><path d="M788.1 340.9c-5.8 4.5-108.2 62.2-108.2 190.5 0 148.4 130.3 200.9 134.2 202.2-.6 3.2-20.7 71.9-68.7 141.9-42.8 61.6-87.5 123.1-155.5 123.1s-85.5-39.5-164-39.5c-76 0-103.7 40.8-165.9 40.8s-105-37.5-155.5-127.4C46.7 790.7 0 663 0 541.8c0-194.3 127.4-297.5 252.8-297.5 66.1 0 121.2 43.4 162.7 43.4 39.5 0 101.1-46 176.3-46 28.5 0 130.9 2.6 198.3 99.2zm-234-181.5c31.1-36.9 53.1-88.1 53.1-139.3 0-7.1-.6-14.3-1.9-20.1-50.6 1.9-110.8 33.7-147.1 75.8-28.5 32.4-55.1 83.6-55.1 135.5 0 7.8 1.3 15.6 1.9 18.1 3.2.6 8.4 1.3 13.6 1.3 45.4 0 102.5-30.4 135.5-71.3z"/></svg>
          Sign in with Apple
        </button>
        {err&&<div style={{color:"#e11d48",fontSize:13,fontWeight:700,marginBottom:12,textAlign:"center"}}>{err}</div>}
        <div style={{textAlign:"center"}}>
          <button onClick={()=>setShowEmail(s=>!s)} style={{background:"none",border:"none",color:"#bbb",fontSize:12,fontWeight:600,cursor:"pointer",textDecoration:"underline",textUnderlineOffset:3}}>
            メールアドレスでログイン
          </button>
        </div>
        {showEmail&&(
          <div style={{marginTop:20}}>
            <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:16}}>
              <div style={{flex:1,height:1,background:"#ebebeb"}}/>
              <span style={{color:"#bbb",fontSize:12,fontWeight:600}}>メール</span>
              <div style={{flex:1,height:1,background:"#ebebeb"}}/>
            </div>
            <input value={email} onChange={e=>setEmail(e.target.value)} placeholder="メールアドレス" type="email" style={inp}/>
            <input value={password} onChange={e=>setPassword(e.target.value)} placeholder="パスワード（6文字以上）" type="password" style={inp}/>
            {msg&&<div style={{color:"#16a34a",fontSize:13,fontWeight:700,marginBottom:10,textAlign:"center"}}>{msg}</div>}
            <button onClick={handle} disabled={loading} style={{width:"100%",height:52,borderRadius:16,border:"none",background:loading?"#ddd":"#111",color:loading?"#aaa":"#fff",fontSize:16,fontWeight:800,cursor:loading?"default":"pointer",marginBottom:12,transition:"all 0.2s"}}>
              {loading?"...":(mode==="login"?"ログイン":"アカウント作成")}
            </button>
            <div style={{textAlign:"center"}}>
              <button onClick={()=>{setMode(m=>m==="login"?"signup":"login");setErr("");setMsg("");}} style={{background:"none",border:"none",color:"#888",fontSize:13,fontWeight:600,cursor:"pointer",textDecoration:"underline",textUnderlineOffset:3}}>
                {mode==="login"?"アカウント作成はこちら":"ログインはこちら"}
              </button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

/* ── Main App ── */
function App(){
  const [authUser,setAuthUser]=useState(null);
  const [authLoading,setAuthLoading]=useState(true);
  const [activeTab,setActiveTab]=useState("肩");
  const [page,setPage]=useState("feed");
  const [editOpen,setEditOpen]=useState(false);
  const [posts,setPosts]=useState([]);
  const [postsLoading,setPostsLoading]=useState(false);
  const [myPosts,setMyPosts]=useState([]);
  const [currentIndex,setCurrentIndex]=useState(0);
  const [showModal,setShowModal]=useState(false);
  const [showGuide,setShowGuide]=useState(false);
  const [filterExercise,setFilterExercise]=useState(null);
  const [commentPost,setCommentPost]=useState(null);
  const [detailPost,setDetailPost]=useState(null);
  const [profile,setProfile]=useState({name:"",weight:70,height:170,avatar:"🐨"});
  const [exercises,setExercises]=useState(()=>{
    try{
      const saved=localStorage.getItem("formie_exercises");
      if(saved){
        const parsed=JSON.parse(saved);
        const merged={};
        Object.keys(DEFAULT_EXERCISES).forEach(tab=>{
          const def=DEFAULT_EXERCISES[tab];
          const cust=parsed[tab]||[];
          const extras=cust.filter(e=>!def.includes(e));
          merged[tab]=[...def,...extras];
        });
        return merged;
      }
    }catch(e){}
    return {...DEFAULT_EXERCISES};
  });
  const containerRef=useRef(null);
  const startY=useRef(null);
  const locked=useRef(false);
  const authUserRef=useRef(null);
  useEffect(()=>{authUserRef.current=authUser;},[authUser]);

  useEffect(()=>{
    supabase.auth.getSession().then(({data:{session}})=>{setAuthUser(session?.user||null);setAuthLoading(false);});
    const {data:{subscription}}=supabase.auth.onAuthStateChange((_,session)=>{setAuthUser(session?.user||null);});
    return()=>subscription.unsubscribe();
  },[]);

  useEffect(()=>{
    if(!authUser)return;
    fetchProfile(authUser.id).then(p=>{if(p)setProfile({name:p.name||"",weight:p.weight||70,height:p.height||170,avatar:p.avatar||"🐨"});});
    fetchMyPosts(authUser.id).then(setMyPosts);
  },[authUser]);

  useEffect(()=>{
    if(!authUser) return;
    if(page==="profile") fetchMyPosts(authUser.id).then(setMyPosts);
  },[page]);

  useEffect(()=>{
    setPostsLoading(true);setCurrentIndex(0);
    fetchPosts(activeTab,filterExercise).then(data=>{setPosts(data);setPostsLoading(false);});
  },[activeTab,filterExercise]);



  const [animated,setAnimated]=useState(true);
  const advanceSlide=useCallback(()=>{
    if(!posts.length) return;
    if(currentIndex>=posts.length-1){
      // jump to index 0 instantly (no animation), then allow next swipe
      setAnimated(false);
      setCurrentIndex(0);
      setTimeout(()=>setAnimated(true),50);
    } else {
      setAnimated(true);
      setCurrentIndex(i=>i+1);
    }
  },[currentIndex,posts.length]);

  const onTouchStart=e=>{startY.current=e.touches[0].clientY;};
  const onTouchEnd=e=>{
    const dy=startY.current-e.changedTouches[0].clientY;
    if(dy>50) advanceSlide();
  };
  useEffect(()=>{
    const h=e=>{
      e.preventDefault();
      if(locked.current)return;
      locked.current=true;
      if(e.deltaY>30) advanceSlide();
      setTimeout(()=>{locked.current=false;},700);
    };
    const el=containerRef.current;
    if(el)el.addEventListener("wheel",h,{passive:false});
    return()=>{if(el)el.removeEventListener("wheel",h);};
  },[advanceSlide]);

  const addComment=(postId,text)=>{
    const c={user:profile.name||"あなた",avatar:profile.avatar||"🐨",text,time:"今",replies:[]};
    setPosts(prev=>prev.map(p=>p.id===postId?{...p,comments:[...p.comments,c]}:p));
    setMyPosts(prev=>prev.map(p=>p.id===postId?{...p,comments:[...p.comments,c]}:p));
    setCommentPost(prev=>prev?{...prev,comments:[...prev.comments,c]}:null);
  };
  const addPost=async(data)=>{
    if(!authUser)return;
    // savePostはPostModal側で実施済み。ここではフィードを再取得するだけ
    fetchPosts(activeTab).then(setPosts);
    fetchMyPosts(authUser.id).then(setMyPosts);
    setCurrentIndex(0);
  };
  const handleSaveProfile=async(p)=>{
    setProfile(p);
    if(authUser) await upsertProfile(authUser.id,p);
  };
  const addExercise=(tab,name)=>setExercises(prev=>{
    const next={...prev,[tab]:[...(prev[tab]||[]),name]};
    try{localStorage.setItem("formie_exercises",JSON.stringify(next));}catch(e){}
    return next;
  });

  const deletePost=(postId)=>{
    setPosts(prev=>prev.filter(p=>p.id!==postId));
    setMyPosts(prev=>prev.filter(p=>p.id!==postId));
    setDetailPost(null);
  };
  const TAB_H=68;

  if(authLoading)return(
    <div style={{width:"100%",height:"100dvh",display:"flex",alignItems:"center",justifyContent:"center",background:"#fff"}}>
      <div style={{textAlign:"center"}}><div style={{fontSize:48,marginBottom:12}}>💪</div><div style={{color:"#bbb",fontSize:14,fontWeight:700}}>読み込み中...</div></div>
    </div>
  );

  if(!authUser)return <LoginScreen onAuth={u=>setAuthUser(u)}/>;

  return(
    <div style={{width:"100%",height:"100dvh",background:"#fff",display:"flex",flexDirection:"column",overflow:"hidden",position:"relative"}}>

      {page==="feed"&&!editOpen&&(
        <>
          <div style={{position:"absolute",top:0,left:0,right:0,zIndex:100,padding:"12px 12px 0",background:"rgba(255,255,255,0.93)",backdropFilter:"blur(12px)"}}>
            <div style={{display:"flex",gap:4}}>
              {TABS.map(t=><button key={t} onClick={()=>setActiveTab(t)} style={{flex:1,padding:"8px 0",borderRadius:10,border:"none",cursor:"pointer",fontSize:13,fontWeight:800,transition:"all 0.18s",background:activeTab===t?"#111":"transparent",color:activeTab===t?"#fff":"#bbb"}}>{t}</button>)}
            </div>
            {filterExercise&&(
              <div style={{display:"flex",alignItems:"center",gap:8,marginTop:6,background:"#f0f0f0",borderRadius:10,padding:"6px 12px",border:"1.5px solid #e0e0e0"}}>
                <span style={{fontSize:13}}>🔍</span>
                <span style={{color:"#111",fontSize:12,fontWeight:800,flex:1}}>{filterExercise}</span>
                <button onClick={()=>setFilterExercise(null)} style={{background:"#e0e0e0",border:"none",borderRadius:6,color:"#555",fontSize:11,fontWeight:800,padding:"2px 8px",cursor:"pointer"}}>✕</button>
              </div>
            )}
            <div style={{height:1,background:"#f2f2f2",marginTop:8}}/>
          </div>
          <div ref={containerRef} onTouchStart={onTouchStart} onTouchEnd={onTouchEnd} style={{flex:1,overflow:"hidden",position:"relative",marginTop:filterExercise?90:56,marginBottom:TAB_H}}>
            {postsLoading?(
              <div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100%",color:"#bbb",flexDirection:"column",gap:12}}>
                <div style={{fontSize:40}}>⏳</div><div style={{fontSize:14,fontWeight:700}}>読み込み中...</div>
              </div>
            ):posts.length===0?(
              <div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100%",flexDirection:"column",gap:12}}>
                <div style={{fontSize:52}}>📭</div><div style={{fontSize:15,fontWeight:700,color:"#bbb"}}>まだ投稿がありません</div>
              </div>
            ):(
              <div style={{height:"100%",transition:animated?"transform 0.4s cubic-bezier(0.25,0.46,0.45,0.94)":"none",transform:`translateY(-${currentIndex*100}%)`}}>
                {posts.map((post,i)=>(
                  <div key={post.id} data-slide="1" style={{height:"100%",width:"100%"}}>
                    <VideoSlide post={post} isFirst={i===0&&currentIndex===0} onCommentOpen={(onAdd)=>setCommentPost({post,onAdd})} authUser={authUser} onDelete={deletePost} onGuide={()=>setShowGuide(true)}/>
                  </div>
                ))}
              </div>
            )}
            {/* 次の1〜2本を裏で先読み */}
            <div style={{display:"none"}}>
              {[1,2].map(offset=>{
                const p=posts[currentIndex+offset];
                return p?.videoUrl?<video key={p.id} src={p.videoUrl} preload="auto" muted playsInline/>:null;
              })}
            </div>
          </div>
          {posts.length>1&&(
            <div style={{position:"absolute",right:10,top:"50%",transform:"translateY(-50%)",display:"flex",flexDirection:"column",gap:5,zIndex:50}}>
              {posts.map((_,i)=><div key={i} style={{width:3,height:i===currentIndex%posts.length?18:5,borderRadius:2,background:i===currentIndex%posts.length?"#111":"#ddd",transition:"all 0.3s"}}/>)}
            </div>
          )}
        </>
      )}

      {page==="profile"&&!editOpen&&(
        <div style={{flex:1,overflow:"hidden",marginBottom:TAB_H}}>
          <ProfileScreen profile={profile} myPosts={myPosts} onEditOpen={()=>setEditOpen(true)} onPostTap={p=>setDetailPost(p)} onLogout={async()=>{await supabase.auth.signOut();setAuthUser(null);}} onDelete={deletePost} authUser={authUser}/>
        </div>
      )}

      {editOpen&&(
        <div style={{position:"absolute",inset:0,zIndex:200,background:"#fff",marginBottom:TAB_H}}>
          <EditProfileScreen profile={profile} onSave={handleSaveProfile} onBack={()=>setEditOpen(false)}/>
        </div>
      )}

      <div style={{position:"absolute",bottom:0,left:0,right:0,height:TAB_H,background:"rgba(255,255,255,0.96)",backdropFilter:"blur(16px)",borderTop:"1.5px solid #f2f2f2",display:"flex",alignItems:"center",zIndex:100}}>
        <button onClick={()=>{setPage("feed");setEditOpen(false);}} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:3,background:"none",border:"none",cursor:"pointer",height:"100%"}}>
          {Ic.home(page==="feed")}<span style={{fontSize:10,fontWeight:800,color:page==="feed"?"#111":"#bbb"}}>ホーム</span>
        </button>
        <div style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center"}}>
          <button onClick={()=>setShowModal(true)} style={{width:52,height:52,borderRadius:"50%",background:"#111",border:"none",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",boxShadow:"0 4px 16px rgba(0,0,0,0.18)"}}>
            {Ic.plus()}
          </button>
        </div>
        <button onClick={()=>{setPage("profile");setEditOpen(false);}} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:3,background:"none",border:"none",cursor:"pointer",height:"100%"}}>
          {Ic.user(page==="profile")}<span style={{fontSize:10,fontWeight:800,color:page==="profile"?"#111":"#bbb"}}>マイページ</span>
        </button>
      </div>

      {commentPost&&<CommentsSheet post={commentPost.post} onClose={()=>setCommentPost(null)} onAdd={t=>{addComment(commentPost.post.id,t);commentPost.onAdd&&commentPost.onAdd();}} profile={profile} authUser={authUser}/>}
      {detailPost&&<PostDetail post={detailPost} onClose={()=>setDetailPost(null)} profile={profile} onComment={addComment} onDelete={deletePost} authUser={authUser}/>}
      {showModal&&<PostModal onClose={()=>setShowModal(false)} onPost={addPost} profile={profile} exercises={exercises} onAddExercise={addExercise} authUserRef={authUserRef}/>}
      {showGuide&&<ExerciseGuide tab={activeTab} onClose={()=>setShowGuide(false)} onWatchVideo={(name)=>{setShowGuide(false);setFilterExercise(name);setPage("feed");}}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
